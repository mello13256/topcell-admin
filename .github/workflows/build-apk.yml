name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Sync Capacitor Android
        id: sync_step
        continue-on-error: true
        run: |
          npx cap sync android > sync-debug.log 2>&1
          echo "EXIT_CODE=$?" >> sync-debug.log
          cat sync-debug.log

      - name: Save debug log if sync failed
        if: steps.sync_step.outcome == 'failure'
        run: |
          git config user.email "ci@topcell.local"
          git config user.name "CI Debug"
          git add -f sync-debug.log
          git commit -m "debug: log do erro no cap sync android [skip ci]"
          git push
          exit 1

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: topcell-admin-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: "APK gerado automaticamente. Baixe o arquivo .apk abaixo e instale no celular (pode ser necessário permitir 'instalar de fontes desconhecidas')."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
